<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#275d3b"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"><title>NutriTrack</title></head><body><header><p>Central Mayorista · Medellín</p><h1>NutriTrack</h1><span id="sync">Conectando…</span></header><main><section class="hero"><div><p class="eyebrow">CAPTURADOR DE CAMPO</p><h2>Compra rápida</h2><p>Selecciona solo lo que llevas hoy.</p></div><button id="dashboard-button" class="secondary">Ver stock</button></section><form id="purchase-form"><div id="cards" class="cards" aria-live="polite"></div><button id="confirm" type="submit">Finalizar y confirmar <span>→</span></button></form><section id="dashboard" hidden><div class="section-title"><h2>Estado de inventario</h2><button id="close-dashboard" class="text">Cerrar</button></div><div id="stock-list"></div></section></main><template id="card-template"><article class="ingredient-card"><div class="card-title"><div><h3></h3><small></small></div><label class="toggle"><input type="checkbox"><span></span></label></div><div class="fields" hidden><label>Lugar de compra<input class="place" list="places" required placeholder="Bloque 11 - Mayorista"></label><label>Presentación / Marca<input class="brand" placeholder="Opcional"></label><div class="pair"><label>Precio pagado (COP)<input class="price" type="number" min="1" step="1" inputmode="numeric" required></label><label>Cantidad<input class="quantity" type="number" min="0.01" step="0.01" inputmode="decimal" required></label></div></div></article></template><datalist id="places"><option>Bloque 11 - Mayorista</option><option>Bloque 21 - Mayorista</option><option>Graneros</option></datalist><div id="toast" role="status"></div><script src="./config.js"></script><script src="./app.js"></script></body></html>
