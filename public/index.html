<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#275d3b"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"><title>NutriTrack</title></head><body><header><p>Central Mayorista · Medellín</p><h1>NutriTrack</h1><span id="sync">Conectando…</span></header><main><section class="hero"><div><p class="eyebrow">CAPTURADOR DE CAMPO</p><h2>Compra rápida</h2><p>Toca un producto y captura solo lo necesario.</p></div><button id="dashboard-button" class="secondary">Ver stock</button></section><form id="purchase-form"><p class="hint">El indicador verde muestra cuánto falta para inventario completo.</p><div id="cards" class="cards" aria-live="polite"></div><button id="confirm" type="submit"><span class="confirm-title">Finalizar y confirmar</span><span id="purchase-summary">0 productos · $0 COP</span></button></form><section id="dashboard" hidden><div class="section-title"><h2>Estado de inventario</h2><button id="close-dashboard" class="text">Cerrar</button></div><div id="stock-list"></div></section></main><template id="card-template"><article class="ingredient-card"><div class="compact-row"><label class="toggle" aria-label="Añadir ingrediente"><input type="checkbox"><span></span></label><button class="ingredient-summary" type="button"><span class="ingredient-main"><b class="ingredient-name"></b><span class="badges"><small class="day-badge"></small><small class="unit-badge"></small><small class="target-badge"></small></span></span><span class="price-summary">Sin precio <i>⌄</i></span></button></div><div class="fields" hidden><label class="price-label">Precio pagado (COP)<input class="price" type="number" min="1" step="1" inputmode="numeric" required></label><div class="quick-actions" aria-label="Ajustar precio"><button type="button" data-delta="-500">−$500</button><button type="button" data-delta="500">+$500</butt
